name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Native engine + cpp/3rdparty submodules are intentionally not built
      # here: the engine has its own OS-specific build scripts
      # (app/src/main/cpp/build.sh / build.bat) and CI adds little to what
      # both platforms already validate locally. Kotlin compile + lint + a
      # real APK assembly run on every push.
      - name: Lint, compile, assemble
        run: >
          ./gradlew
          :app:ktlintBasicDebugSourceSetCheck
          :app:ktlintFilterDebugSourceSetCheck
          :app:detekt
          assembleBasicDebug
          --stacktrace

  # Publishes installable builds to GitHub releases — one release per master
  # push (tag debug-<sha>, changelog from the commit history), so testers can
  # pick a specific build instead of digging through a rolling asset pile.
  # Requires the QAIRT SDK (public community download), NDK r28 (r29-built
  # engines fail on device - see Codebase_Walkthrough.md) and Rust 1.85 with
  # the Android target for tokenizers-cpp. APKs are signed with the
  # repo-committed ci/debug.keystore so successive CI builds upgrade in place.
  test-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QAIRT_URL: https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.39.0.250926/v2.39.0.250926.zip
      QAIRT_VERSION_DIR: 2.39.0.250926
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags: the changelog is generated from the commits
          # since the previous debug-* release tag.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The MNN submodule ships its own old gradle-wrapper.jar, which the
          # default wrapper validation rejects; the root wrapper is already
          # validated in the lint-and-build job (which checks out without
          # submodules).
          validate-wrappers: false

      # Rust for tokenizers-cpp; 1.85 because newer rustc denies
      # dangerous_implicit_autorefs, which breaks tokenizers-c.
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android

      - name: Install NDK r28
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache QAIRT SDK
        id: qairt-cache
        uses: actions/cache@v4
        with:
          path: ~/qairt
          key: qairt-2.39.0.250926

      - name: Download QAIRT SDK
        if: steps.qairt-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/qairt.zip "$QAIRT_URL"
          unzip -q /tmp/qairt.zip -d "$HOME"
          rm /tmp/qairt.zip
          test -d "$HOME/qairt/$QAIRT_VERSION_DIR"

      - name: Build native engine
        run: |
          NDK="$ANDROID_NDK_ROOT"
          QNN="$HOME/qairt/$QAIRT_VERSION_DIR"
          cmake -S app/src/main/cpp -B app/src/main/cpp/build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_ANDROID_NDK="$NDK" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 -DANDROID_NATIVE_API_LEVEL=21 \
            -DCMAKE_SYSTEM_VERSION=21 -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DQNN_DEBUG_ENABLE=OFF -DQNN_SDK_ROOT="$QNN" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build app/src/main/cpp/build/android
          cp -r app/src/main/cpp/build/android/qnnlibs app/src/main/assets/
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp app/src/main/cpp/build/android/bin/arm64-v8a/libstable_diffusion_core.so \
             app/src/main/jniLibs/arm64-v8a/

      - name: Assemble debug APKs
        run: ./gradlew assembleBasicDebug assembleFilterDebug --stacktrace

      - name: Stage APKs for release
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/basic/debug/*.apk  "LocalDream_${SHORT_SHA}_basic_debug.apk"
          cp app/build/outputs/apk/filter/debug/*.apk "LocalDream_${SHORT_SHA}_filter_debug.apk"

      # One release per build. The changelog covers commits since the previous
      # debug-* tag. Future Beta line: same flow with a beta-<sha> tag and
      # make_latest: "true", so the newest beta shows up as the repo's primary
      # release for easy access.
      - name: Generate release notes
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="debug-${SHORT_SHA}"
          PREV_TAG=$(git tag --list 'debug-*' --sort=-creatordate | head -n 1)
          {
            echo "### LocalDream debug build \`${SHORT_SHA}\`"
            echo
            echo "_Built from master at \`${GITHUB_SHA}\` on $(date -u '+%Y-%m-%d %H:%M UTC')._"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Changes since \`${PREV_TAG}\`:**"
              echo
              git log --format='* %h %s' "${PREV_TAG}..HEAD"
            else
              echo "**Recent commits:**"
              echo
              git log --format='* %h %s' -n 10
            fi
            echo
            echo "**Install:** allow \"Install unknown apps\" for your browser or file manager, then install the APK for the flavor you want:"
            echo "- \`LocalDream_${SHORT_SHA}_basic_debug.apk\` — standard build"
            echo "- \`LocalDream_${SHORT_SHA}_filter_debug.apk\` — adds the NSFW checker (enforces the threshold)"
            echo
            echo "Both flavors include the native engine and share an applicationId — install one at a time. CI builds share a single signing key, so each new build upgrades in place over the previous one."
          } > release_notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Debug build ${{ env.TAG }}"
          body_path: release_notes.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            LocalDream_*_basic_debug.apk
            LocalDream_*_filter_debug.apk

