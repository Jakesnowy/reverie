name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Beta releases: run manually against any ref once a master state is
  # beta-worthy. Debug releases stay automatic on master pushes.
  workflow_dispatch:
    inputs:
      release_kind:
        description: 'Release line to build'
        type: choice
        default: debug
        options:
          - debug
          - beta

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Native engine + cpp/3rdparty submodules are intentionally not built
      # here: the engine has its own OS-specific build scripts
      # (app/src/main/cpp/build.sh / build.bat) and CI adds little to what
      # both platforms already validate locally. Kotlin compile + lint + a
      # real APK assembly run on every push.
      - name: Lint, compile, assemble
        run: >
          ./gradlew
          :app:ktlintBasicDebugSourceSetCheck
          :app:ktlintFilterDebugSourceSetCheck
          :app:detekt
          assembleBasicDebug
          --stacktrace

  # Publishes installable builds to GitHub releases — one release per master
  # push (tag debug-<sha>, changelog from the commit history), so testers can
  # pick a specific build instead of digging through a rolling asset pile.
  # Requires the QAIRT SDK (public community download), NDK r28 (r29-built
  # engines fail on device - see Codebase_Walkthrough.md) and Rust 1.85 with
  # the Android target for tokenizers-cpp. APKs are signed with the
  # repo-committed ci/debug.keystore so successive CI builds upgrade in place.
  test-release:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QAIRT_URL: https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.39.0.250926/v2.39.0.250926.zip
      QAIRT_VERSION_DIR: 2.39.0.250926
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags: the changelog is generated from the commits
          # since the previous release tag of the same line.
          fetch-depth: 0

      - name: Resolve release line
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.release_kind }}" = "beta" ]; then
            echo "RELEASE_KIND=beta" >> "$GITHUB_ENV"
          else
            echo "RELEASE_KIND=debug" >> "$GITHUB_ENV"
          fi

      # Beta builds are signed with the distribution keystore kept in repo
      # secrets; it is decoded per-run and never written into the checkout.
      - name: Decode beta signing keystore
        if: env.RELEASE_KIND == 'beta'
        run: |
          echo "${{ secrets.BETA_KEYSTORE_BASE64 }}" | base64 -d > /tmp/beta.keystore
          {
            echo "BETA_STORE_FILE=/tmp/beta.keystore"
            echo "BETA_STORE_PASSWORD=${{ secrets.BETA_STORE_PASSWORD }}"
            echo "BETA_KEY_ALIAS=${{ secrets.BETA_KEY_ALIAS }}"
            echo "BETA_KEY_PASSWORD=${{ secrets.BETA_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The MNN submodule ships its own old gradle-wrapper.jar, which the
          # default wrapper validation rejects; the root wrapper is already
          # validated in the lint-and-build job (which checks out without
          # submodules).
          validate-wrappers: false

      # Rust for tokenizers-cpp; 1.85 because newer rustc denies
      # dangerous_implicit_autorefs, which breaks tokenizers-c.
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android

      - name: Install NDK r28
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache QAIRT SDK
        id: qairt-cache
        uses: actions/cache@v4
        with:
          path: ~/qairt
          key: qairt-2.39.0.250926

      - name: Download QAIRT SDK
        if: steps.qairt-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/qairt.zip "$QAIRT_URL"
          unzip -q /tmp/qairt.zip -d "$HOME"
          rm /tmp/qairt.zip
          test -d "$HOME/qairt/$QAIRT_VERSION_DIR"

      - name: Build native engine
        run: |
          NDK="$ANDROID_NDK_ROOT"
          QNN="$HOME/qairt/$QAIRT_VERSION_DIR"
          cmake -S app/src/main/cpp -B app/src/main/cpp/build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_ANDROID_NDK="$NDK" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 -DANDROID_NATIVE_API_LEVEL=21 \
            -DCMAKE_SYSTEM_VERSION=21 -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DQNN_DEBUG_ENABLE=OFF -DQNN_SDK_ROOT="$QNN" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build app/src/main/cpp/build/android
          cp -r app/src/main/cpp/build/android/qnnlibs app/src/main/assets/
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp app/src/main/cpp/build/android/bin/arm64-v8a/libstable_diffusion_core.so \
             app/src/main/jniLibs/arm64-v8a/

      - name: Assemble APKs
        run: |
          if [ "$RELEASE_KIND" = "beta" ]; then
            # Monotonic versionCode so each beta upgrades over the previous
            # one; RUN_NUMBER grows with every run of this workflow. Signing
            # values arrive as env vars from the decode step and must be
            # converted to -P properties here (findProperty does not read
            # env vars).
            ./gradlew assembleBasicBeta assembleFilterBeta --stacktrace \
              -POVERRIDE_VERSION_CODE=$((74 + RUN_NUMBER)) \
              -PBETA_STORE_FILE="$BETA_STORE_FILE" \
              -PBETA_STORE_PASSWORD="$BETA_STORE_PASSWORD" \
              -PBETA_KEY_ALIAS="$BETA_KEY_ALIAS" \
              -PBETA_KEY_PASSWORD="$BETA_KEY_PASSWORD"
          else
            ./gradlew assembleBasicDebug assembleFilterDebug --stacktrace
          fi

      - name: Stage APKs for release
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$RELEASE_KIND" = "beta" ]; then
            cp app/build/outputs/apk/basic/beta/*.apk  "LocalDream_${SHORT_SHA}_basic_beta.apk"
            cp app/build/outputs/apk/filter/beta/*.apk "LocalDream_${SHORT_SHA}_filter_beta.apk"
          else
            cp app/build/outputs/apk/basic/debug/*.apk  "LocalDream_${SHORT_SHA}_basic_debug.apk"
            cp app/build/outputs/apk/filter/debug/*.apk "LocalDream_${SHORT_SHA}_filter_debug.apk"
          fi

      # One release per build. The changelog covers commits since the previous
      # tag of the same line. Beta releases are the primary/latest release;
      # debug releases are prereleases that never claim "Latest".
      - name: Generate release notes
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="${RELEASE_KIND}-${SHORT_SHA}"
          PREV_TAG=$(git tag --list "${RELEASE_KIND}-*" --sort=-creatordate | head -n 1)
          {
            echo "### LocalDream ${RELEASE_KIND} build \`${SHORT_SHA}\`"
            echo
            echo "_Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\` on $(date -u '+%Y-%m-%d %H:%M UTC')._"
            echo
            if [ "$RELEASE_KIND" = "beta" ]; then
              echo "> **Beta channel — this repo's official build, bleeding edge.** Installs side-by-side with debug builds (different application id). Switching from the official upstream app needs a one-time uninstall (same application id, different signature). Beta builds upgrade in place over previous betas."
              echo
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Changes since \`${PREV_TAG}\`:**"
              echo
              git log --format='* %h %s' "${PREV_TAG}..HEAD"
            else
              echo "**Recent commits:**"
              echo
              git log --format='* %h %s' -n 10
            fi
            echo
            echo "**Install:** allow \"Install unknown apps\" for your browser or file manager, then install the APK for the flavor you want:"
            echo "- \`LocalDream_${SHORT_SHA}_basic_${RELEASE_KIND}.apk\` — standard build"
            echo "- \`LocalDream_${SHORT_SHA}_filter_${RELEASE_KIND}.apk\` — adds the NSFW checker (enforces the threshold)"
            echo
            echo "Both flavors include the native engine and share an applicationId — install one at a time. Builds within a line share a signing key, so each new build upgrades in place over the previous one."
          } > release_notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [ "$RELEASE_KIND" = "beta" ]; then
            echo "RELEASE_TITLE=Beta build $TAG" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "MARK_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TITLE=Debug build $TAG" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "MARK_LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_notes.md
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.MARK_LATEST }}
          fail_on_unmatched_files: true
          files: |
            LocalDream_*_basic_*.apk
            LocalDream_*_filter_*.apk

